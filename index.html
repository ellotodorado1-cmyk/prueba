<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Citas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f6f8; padding: 20px; display: flex; justify-content: center; }

    .container {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 { text-align: center; margin-bottom: 20px; color: #1a1a1a; font-size: 1.25rem; }

    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .cal-header button {
      background: #0066cc;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .cal-header button:hover { background: #0052a3; }
    .cal-header h3 { font-size: 1rem; color: #333; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }
    .cal-day-name { font-weight: bold; padding: 6px 0; background: #f0f2f5; border-radius: 4px; font-size: 0.75rem; color: #666; }
    .cal-day {
      padding: 10px 0;
      background: #fff;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .cal-day:hover:not(.empty) { background: #eef5ff; border-color: #0066cc; }
    .cal-day.selected { background: #0066cc; color: white; font-weight: bold; border-color: #0066cc; }
    .cal-day.empty { background: transparent; border: none; cursor: default; }

    .horas-container { margin-top: 25px; border-top: 1px solid #eee; pt: 15px; }
    .horas-container h3 { font-size: 0.95rem; color: #444; margin-top: 15px; }
    
    .horas-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .hora-slot {
      padding: 10px 5px;
      background: #f8f9fa;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .hora-slot:hover { background: #28a745; color: white; border-color: #28a745; }

    .status-msg { margin-top: 12px; text-align: center; color: #666; font-size: 0.85rem; min-height: 20px; }
    .loader { display: inline-block; animation: spin 1s infinite linear; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container">
    <h2>Selecciona una Fecha</h2>

    <div class="cal-header">
      <button onclick="cambiarMes(-1)">&lt;</button>
      <h3 id="cal-titulo"></h3>
      <button onclick="cambiarMes(1)">&gt;</button>
    </div>

    <div class="cal-grid" id="cal-dias"></div>

    <div class="horas-container">
      <h3>Horarios Disponibles (7:00 AM - 7:00 PM)</h3>
      <div id="status" class="status-msg">Selecciona un día en el calendario.</div>
      <div class="horas-grid" id="horas-grid"></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzECJPTQWUYs3959atjqWt-FWBpeGClmREJDB38B9G1zv66T0RNQJDFPesX01fxkqJn/exec';

    let fechaActual = new Date();
    let mesActual = fechaActual.getMonth();
    let anioActual = fechaActual.getFullYear();
    let diaSeleccionado = null;
    let abortController = null; // Para cancelar peticiones previas

    const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

    function renderizarCalendario() {
      const titulo = document.getElementById('cal-titulo');
      const contenedorDias = document.getElementById('cal-dias');
      
      titulo.innerText = `${meses[mesActual]} ${anioActual}`;
      contenedorDias.innerHTML = `
        <div class="cal-day-name">Dom</div><div class="cal-day-name">Lun</div>
        <div class="cal-day-name">Mar</div><div class="cal-day-name">Mié</div>
        <div class="cal-day-name">Jue</div><div class="cal-day-name">Vie</div>
        <div class="cal-day-name">Sáb</div>
      `;

      const primerDiaMes = new Date(anioActual, mesActual, 1).getDay();
      const totalDiasMes = new Date(anioActual, mesActual + 1, 0).getDate();

      for (let i = 0; i < primerDiaMes; i++) {
        contenedorDias.innerHTML += `<div class="cal-day empty"></div>`;
      }

      for (let dia = 1; dia <= totalDiasMes; dia++) {
        const divDia = document.createElement('div');
        divDia.className = 'cal-day';
        divDia.innerText = dia;
        
        if (diaSeleccionado && diaSeleccionado.dia === dia && diaSeleccionado.mes === mesActual && diaSeleccionado.anio === anioActual) {
          divDia.classList.add('selected');
        }

        divDia.onclick = () => seleccionarDia(dia, divDia);
        contenedorDias.appendChild(divDia);
      }
    }

    function cambiarMes(delta) {
      mesActual += delta;
      if (mesActual < 0) { mesActual = 11; anioActual--; }
      else if (mesActual > 11) { mesActual = 0; anioActual++; }
      renderizarCalendario();
    }

    function seleccionarDia(dia, elemento) {
      document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('selected'));
      elemento.classList.add('selected');
      
      diaSeleccionado = { dia: dia, mes: mesActual, anio: anioActual };
      consultarHorarios(anioActual, mesActual, dia);
    }

    // Función de petición con Reintentos Automáticos y Timeout
    async function fetchConReintento(url, opciones = {}, reintentos = 3, retardo = 1000) {
      for (let i = 0; i < reintentos; i++) {
        try {
          const respuesta = await fetch(url, opciones);
          if (!respuesta.ok) throw new Error(`HTTP Error ${respuesta.status}`);
          return await respuesta.json();
        } catch (err) {
          if (err.name === 'AbortError') throw err; // Si fue cancelado por el usuario, no reintentar
          if (i === reintentos - 1) throw err; // Si se agotaron los reintentos, lanzar error
          await new Promise(res => setTimeout(res, retardo)); // Esperar antes de reintentar
        }
      }
    }

    async function consultarHorarios(anio, mes, dia) {
      const status = document.getElementById('status');
      const gridHoras = document.getElementById('horas-grid');
      
      gridHoras.innerHTML = '';
      status.innerHTML = 'Consultando disponibilidad...';

      // Cancelar petición anterior si el usuario dio clic en otro día
      if (abortController) abortController.abort();
      abortController = new AbortController();

      const url = `${API_URL}?anio=${anio}&mes=${mes}&dia=${dia}&duracion=60`;

      try {
        const res = await fetchConReintento(url, { signal: abortController.signal }, 3, 1200);

        if (res.exito) {
          if (res.horas.length === 0) {
            status.innerText = 'No hay horarios disponibles para este día.';
          } else {
            status.innerText = '';
            res.horas.forEach(h => {
              const btn = document.createElement('div');
              btn.className = 'hora-slot';
              btn.innerText = h.etiqueta;
              btn.onclick = () => alert(`Hora seleccionada: ${h.etiqueta}`);
              gridHoras.appendChild(btn);
            });
          }
        } else {
          status.innerText = 'Error: ' + res.error;
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          status.innerText = 'El servidor tardó en responder. Por favor intenta dar clic de nuevo.';
        }
      }
    }

    renderizarCalendario();
  </script>
</body>
</html>
