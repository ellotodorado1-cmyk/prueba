<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abrir en Safari</title>
  <style>
    :root {
      --primary: #c07a5f;
      --bg: #fcf9f6;
      --text: #4a4a4a;
    }
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 12px;
      color: #333;
    }
    p {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .ios-instructions {
      display: none;
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      text-align: left;
    }
    .ios-instructions ol {
      margin: 8px 0 0 0;
      padding-left: 20px;
      font-size: 0.9rem;
      color: #856404;
      line-height: 1.5;
    }
    .arrow-pointer {
      position: fixed;
      top: 10px;
      right: 15px;
      font-size: 24px;
      animation: bounce 1s infinite alternate;
      display: none;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <div id="arrow" class="arrow-pointer">↗️</div>

  <div class="card">
    <h1>Abrir Sistema de Reservas</h1>
    <p>Para continuar, abre este enlace en Safari o tu navegador principal.</p>

    <!-- Botón para Android / Desktop -->
    <a id="main-btn" class="btn" href="#">Continuar</a>

    <!-- Instrucción obligatoria para iOS dentro de Facebook/Instagram -->
    <div id="ios-box" class="ios-instructions">
      <strong style="color: #856404;">⚠️ Para abrir en Safari en iPhone:</strong>
      <ol>
        <li>Toca el icono de los <strong>tres puntos (•••)</strong> en la esquina superior derecha.</li>
        <li>Selecciona <strong>"Abrir en el navegador"</strong> o <strong>"Abrir en Safari"</strong>.</li>
      </ol>
    </div>
  </div>

  <script>
    // REEMPLAZA CON TU ENLACE DE GOOGLE APPS SCRIPT
    const TARGET_URL = "https://script.google.com/macros/s/TU_SCRIPT_ID/exec";

    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
    const isFBorInsta = /FBAN|FBAV|Instagram/.test(userAgent);
    const isAndroid = /Android/.test(userAgent);

    const mainBtn = document.getElementById('main-btn');
    const iosBox = document.getElementById('ios-box');
    const arrow = document.getElementById('arrow');

    if (isIOS && isFBorInsta) {
      // En iOS dentro de Facebook/Instagram se muestra la guía visual
      iosBox.style.display = "block";
      arrow.style.display = "block";
      mainBtn.href = TARGET_URL;
      mainBtn.innerText = "Reintentar abrir";
    } else if (isAndroid && isFBorInsta) {
      // Android rompe el navegador con la intención de Chrome
      const cleanUrl = TARGET_URL.replace(/^https?:\/\//, '');
      mainBtn.href = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end`;
    } else {
      // Safari o navegador externo normal
      mainBtn.href = TARGET_URL;
    }
  </script>

</body>
</html>
