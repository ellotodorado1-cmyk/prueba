<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Masajes</title>
  <style>
    :root {
      --primary: #c07a5f; --primary-hover: #a3644b;
      --bg: #fcf9f6; --card-bg: #ffffff; --text: #4a4a4a;
      --border: #e0d5ce; --error: #d9534f; --success: #5cb85c;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { background: var(--card-bg); max-width: 600px; width: 100%; border-radius: 12px; box-shadow: 0 8px 24px rgba(192, 122, 95, 0.08); padding: 30px; }
    .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
    .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: 600; color: #a0a0a0; transition: 0.3s; }
    .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); margin-bottom: -2px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.9em; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1em; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(192,122,95,0.2); }
    .note { font-size: 0.8em; color: #888; margin-top: 4px; display: block; }
    button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 1em; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; }
    button:hover:not(:disabled) { background: var(--primary-hover); }
    button:disabled { background: #dcdcdc; cursor: not-allowed; }
    button.secondary { background: #f0f0f0; color: var(--text); margin-top: 10px;}
    button.danger { background: white; color: var(--error); border: 1px solid var(--error); margin-top: 10px; }
    button.danger:hover { background: var(--error); color: white; }
    .step { display: none; }
    .step.active { display: block; animation: fadeIn 0.4s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .calendar-container { border: 1px solid var(--border); border-radius: 8px; padding: 15px; background: #fff; margin-bottom: 15px; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; }
    .cal-nav { background: none; border: none; font-size: 1.2em; color: var(--primary); cursor: pointer; padding: 0 10px; width: auto; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
    .cal-day-name { font-size: 0.8em; font-weight: 600; color: #888; padding-bottom: 5px; }
    .cal-day { padding: 10px 0; border-radius: 6px; cursor: pointer; font-size: 0.9em; transition: 0.2s; }
    .cal-day:hover:not(.disabled) { background: #f0e6e1; }
    .cal-day.selected { background: var(--primary); color: white; font-weight: bold; }
    .cal-day.disabled { color: #d0d0d0; cursor: not-allowed; background: transparent; }
    
    .time-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 15px; }
    .time-slot { padding: 10px; border: 1px solid var(--primary); border-radius: 6px; text-align: center; cursor: pointer; color: var(--primary); font-weight: bold;}
    .time-slot:hover, .time-slot.selected { background: var(--primary); color: white; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .message { padding: 15px; border-radius: 6px; margin-bottom: 15px; display: none; text-align: center; }
    .message.success { background: #dff0d8; color: #3c763d; display: block; }
    .message.error { background: #f2dede; color: #a94442; border: 1px solid #ebccd1; display: block; }
    .summary-card { background: #f9f9f9; padding: 15px; border-radius: 6px; margin-bottom: 20px; text-align: left; border: 1px dashed var(--border); }
    .timezone-badge { display: inline-block; background: #eef; color: #336; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; margin-bottom: 10px; font-weight: bold;}
  </style>
</head>
<body>

<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('agendar')">Agendar Reserva</div>
    <div class="tab" onclick="switchTab('cancelar')">Cancelar Reserva</div>
  </div>

  <div id="tab-agendar" class="step active">
    <div id="step-datos" class="step active">
      <form id="form-datos">
        <div class="form-group"><label>Nombre completo *</label><input type="text" id="nombre" required></div>
        <div class="form-group"><label>Teléfono *</label><input type="tel" id="telefono" required></div>
        <div class="form-group"><label>Ciudad en Silicon Valley *</label>
          <select id="ciudad" required>
            <option value="">Seleccione una ciudad...</option>
            <option value="Atherton">Atherton</option>
            <option value="Belmont">Belmont</option>
            <option value="Campbell">Campbell</option>
            <option value="Cupertino">Cupertino</option>
            <option value="East Palo Alto">East Palo Alto</option>
            <option value="Fremont">Fremont</option>
            <option value="Los Altos">Los Altos</option>
            <option value="Los Altos Hills">Los Altos Hills</option>
            <option value="Los Gatos">Los Gatos</option>
            <option value="Menlo Park">Menlo Park</option>
            <option value="Milpitas">Milpitas</option>
            <option value="Monte Sereno">Monte Sereno</option>
            <option value="Mountain View">Mountain View</option>
            <option value="Newark">Newark</option>
            <option value="Palo Alto">Palo Alto</option>
            <option value="Portola Valley">Portola Valley</option>
            <option value="Redwood City">Redwood City</option>
            <option value="San Carlos">San Carlos</option>
            <option value="San José">San José</option>
            <option value="Santa Clara">Santa Clara</option>
            <option value="Saratoga">Saratoga</option>
            <option value="Sunnyvale">Sunnyvale</option>
            <option value="Woodside">Woodside</option>
          </select>
        </div>
        <div class="form-group"><label>Dirección exacta *</label><input type="text" id="direccion" required></div>
        <div class="form-group"><label>Tiempo de Servicio y Pago *</label>
          <select id="servicio" required>
            <option value="">Seleccione duración</option>
            <option value="60" data-price="100">1 hora - $100 (Cash o Zelle)</option>
            <option value="90" data-price="150">1 hora y 30 minutos - $150 (Cash o Zelle)</option>
            <option value="120" data-price="200">2 horas - $200 (Cash o Zelle)</option>
            <option value="150" data-price="250">2 horas y 30 minutos - $250 (Cash o Zelle)</option>
            <option value="180" data-price="300">3 horas - $300 (Cash o Zelle)</option>
            <option value="210" data-price="350">3 horas y 30 minutos - $350 (Cash o Zelle)</option>
            <option value="240" data-price="400">4 horas - $400 (Cash o Zelle)</option>
            <option value="270" data-price="450">4 horas y 30 minutos - $450 (Cash o Zelle)</option>
            <option value="300" data-price="500">5 horas - $500 (Cash o Zelle)</option>
            <option value="330" data-price="550">5 horas y 30 minutos - $550 (Cash o Zelle)</option>
            <option value="360" data-price="600">6 horas - $600 (Cash o Zelle)</option>
          </select>
        </div>
        <div class="form-group"><label>Correo electrónico (Opcional)</label><input type="email" id="email"><span class="note">* Necesario para confirmación.</span></div>
        <div class="form-group"><label>Sugerencias (Opcional)</label><textarea id="sugerencias" rows="2"></textarea></div>
        <button type="submit">Continuar al Calendario</button>
      </form>
    </div>

    <div id="step-calendario" class="step">
      <h3 style="margin-top:0;">Selecciona Fecha y Hora</h3>
      <div class="timezone-badge">🌎 Hora de California (PT)</div>
      
      <div class="calendar-container">
        <div class="cal-header">
          <button class="cal-nav" onclick="cambiarMes(-1)">&#10094;</button>
          <span id="cal-mes-anio"></span>
          <button class="cal-nav" onclick="cambiarMes(1)">&#10095;</button>
        </div>
        <div class="cal-grid" id="cal-grid-dias"></div>
      </div>

      <div id="loader-horas" class="loader"></div>
      <div id="contenedor-horas" class="time-grid"></div>
      <p id="msg-no-horas" style="display:none; color: var(--error); font-size: 0.9em;">No hay disponibilidad.</p>
      
      <div style="margin-top: 20px;">
        <button id="btn-reservar" onclick="realizarReserva()" disabled>Confirmar Reserva</button>
        <button class="secondary" onclick="volver('step-datos')">Volver atrás</button>
      </div>
    </div>

    <div id="step-exito" class="step" style="text-align: center;">
      <h2 style="color: var(--success);">¡Reserva Exitosa!</h2>
      <div id="resumen-reserva" class="summary-card"></div>
      <button onclick="reiniciarApp()">Realizar otra reserva</button>
    </div>
  </div>

  <div id="tab-cancelar" class="step">
    <div id="cancelar-inicio" class="step active">
      <div class="form-group"><label>Número de Reserva</label><input type="text" id="num-reserva-input" placeholder="Ej: RES-ABC123"></div>
      <p style="font-size: 0.85em; color: #666;">Nota: Las cancelaciones requieren mínimo <strong>1 hora y 40 minutos</strong> de anticipación.</p>
      <div id="msg-cancelar"></div>
      <div id="loader-cancelar" class="loader"></div>
      <button class="danger" onclick="confirmarCancelar()">Confirmar Cancelación</button>
    </div>
  </div>
</div>

<script>
  // REEMPLAZA ESTA URL CON TU CLOUDFLARE WORKER DEPLOYADO
  const WORKER_URL = "https://tu-worker-subdominio.workers.dev";

  let reservaActual = { horaInicioMs: null, duracion: null, precio: null, anio:null, mes:null, dia:null };

  const optionsSF = { timeZone: 'America/Los_Angeles', year: 'numeric', month: 'numeric', day: 'numeric' };
  const formatterSF = new Intl.DateTimeFormat('en-US', optionsSF);
  const partsSF = formatterSF.formatToParts(new Date());
  
  let sfYear = parseInt(partsSF.find(p => p.type === 'year').value);
  let sfMonth = parseInt(partsSF.find(p => p.type === 'month').value) - 1;
  let sfDay = parseInt(partsSF.find(p => p.type === 'day').value);

  let hoySF = new Date(sfYear, sfMonth, sfDay);
  hoySF.setHours(0,0,0,0);
  let maxDateSF = new Date(hoySF.getTime() + 14 * 24 * 60 * 60 * 1000);
  
  let currentMonth = hoySF.getMonth();
  let currentYear = hoySF.getFullYear();

  const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

  function switchTab(tabId) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.container > .step').forEach(c => c.classList.remove('active'));
    if (tabId === 'agendar') {
      document.querySelector('.tab:nth-child(1)').classList.add('active');
      document.getElementById('tab-agendar').classList.add('active');
    } else {
      document.querySelector('.tab:nth-child(2)').classList.add('active');
      document.getElementById('tab-cancelar').classList.add('active');
    }
  }

  function volver(stepId) {
    document.querySelectorAll('#tab-agendar .step').forEach(s => s.classList.remove('active'));
    document.getElementById(stepId).classList.add('active');
  }

  document.getElementById('form-datos').addEventListener('submit', function(e) {
    e.preventDefault();
    const s = document.getElementById('servicio');
    reservaActual.duracion = s.value;
    reservaActual.precio = s.options[s.selectedIndex].getAttribute('data-price');
    reservaActual.nombre = document.getElementById('nombre').value;
    reservaActual.telefono = document.getElementById('telefono').value;
    reservaActual.ciudad = document.getElementById('ciudad').value;
    reservaActual.direccion = document.getElementById('direccion').value;
    reservaActual.email = document.getElementById('email').value;
    reservaActual.sugerencias = document.getElementById('sugerencias').value;
    
    renderCalendar();
    volver('step-calendario');
  });

  function cambiarMes(dir) {
    currentMonth += dir;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    else if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
  }

  function renderCalendar() {
    document.getElementById('cal-mes-anio').innerText = `${meses[currentMonth]} ${currentYear}`;
    const grid = document.getElementById('cal-grid-dias');
    grid.innerHTML = '<div class="cal-day-name">Do</div><div class="cal-day-name">Lu</div><div class="cal-day-name">Ma</div><div class="cal-day-name">Mi</div><div class="cal-day-name">Ju</div><div class="cal-day-name">Vi</div><div class="cal-day-name">Sa</div>';

    let primerDia = new Date(currentYear, currentMonth, 1).getDay();
    let diasEnMes = new Date(currentYear, currentMonth + 1, 0).getDate();

    for (let i = 0; i < primerDia; i++) grid.innerHTML += `<div></div>`;

    for (let dia = 1; dia <= diasEnMes; dia++) {
      let fechaBucle = new Date(currentYear, currentMonth, dia);
      let esFinDeSemana = (fechaBucle.getDay() === 0 || fechaBucle.getDay() === 6);
      let esPasado = fechaBucle < hoySF;
      let esMuyLejos = fechaBucle > maxDateSF;
      
      let div = document.createElement('div');
      div.className = 'cal-day';
      div.innerText = dia;

      if (esFinDeSemana || esPasado || esMuyLejos) {
        div.classList.add('disabled');
      } else {
        div.onclick = () => seleccionarFecha(currentYear, currentMonth, dia, div);
        if (reservaActual.anio === currentYear && reservaActual.mes === currentMonth && reservaActual.dia === dia) {
          div.classList.add('selected');
        }
      }
      grid.appendChild(div);
    }
  }

  function seleccionarFecha(anio, mes, dia, elementoDiv) {
    document.querySelectorAll(`#cal-grid-dias .cal-day`).forEach(el => el.classList.remove('selected'));
    elementoDiv.classList.add('selected');
    reservaActual.anio = anio; reservaActual.mes = mes; reservaActual.dia = dia;
    cargarHoras(anio, mes, dia);
  }

  async function cargarHoras(anio, mes, dia) {
    document.getElementById('contenedor-horas').innerHTML = '';
    document.getElementById('loader-horas').style.display = 'block';
    document.getElementById('msg-no-horas').style.display = 'none';
    document.getElementById('btn-reservar').disabled = true;

    try {
      const url = `${WORKER_URL}?action=obtenerHoras&anio=${anio}&mes=${mes}&dia=${dia}&duracion=${reservaActual.duracion}`;
      const response = await fetch(url);
      const horas = await response.json();
      mostrarHoras(horas);
    } catch (err) {
      alert("Error al cargar horarios. Intente nuevamente.");
      document.getElementById('loader-horas').style.display = 'none';
    }
  }

  function mostrarHoras(horas) {
    document.getElementById('loader-horas').style.display = 'none';
    const contenedor = document.getElementById('contenedor-horas');
    if (!horas || horas.length === 0) { document.getElementById('msg-no-horas').style.display = 'block'; return; }

    horas.forEach(h => {
      let div = document.createElement('div');
      div.className = 'time-slot';
      div.innerText = h.etiqueta;
      div.onclick = function() {
        document.querySelectorAll('#contenedor-horas .time-slot').forEach(el => el.classList.remove('selected'));
        this.classList.add('selected');
        reservaActual.horaInicioMs = h.valor;
        document.getElementById('btn-reservar').disabled = false;
      };
      contenedor.appendChild(div);
    });
  }

  async function realizarReserva() {
    document.getElementById('btn-reservar').disabled = true;
    document.getElementById('btn-reservar').innerText = 'Procesando...';

    try {
      const response = await fetch(`${WORKER_URL}?action=reservar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(reservaActual)
      });
      
      const res = await response.json();

      if(res.exito) {
        document.getElementById('resumen-reserva').innerHTML = `
          <strong>Reserva #:</strong> ${res.numeroReserva} <br>
          <strong>Fecha (PT):</strong> ${res.fecha} <br>
          <strong>Cliente:</strong> ${reservaActual.nombre} <br>
          <strong>Servicio:</strong> ${reservaActual.duracion} min ($${reservaActual.precio}) <br>
          <strong>Método de Pago:</strong> Cash o Zelle
        `;
        volver('step-exito');
      } else {
        alert("Error: " + res.error);
        document.getElementById('btn-reservar').disabled = false;
        document.getElementById('btn-reservar').innerText = 'Confirmar Reserva';
      }
    } catch (err) {
      alert("Error de conexión al realizar la reserva.");
      document.getElementById('btn-reservar').disabled = false;
      document.getElementById('btn-reservar').innerText = 'Confirmar Reserva';
    }
  }

  function reiniciarApp() {
    document.getElementById('form-datos').reset();
    reservaActual = { horaInicioMs: null, duracion: null, precio: null, anio:null, mes:null, dia:null };
    document.getElementById('contenedor-horas').innerHTML = '';
    document.getElementById('btn-reservar').disabled = true;
    volver('step-datos');
  }

  function mostrarMensajeCancelar(msg, tipo) {
    document.getElementById('msg-cancelar').innerHTML = `<div class="message ${tipo}">${msg}</div>`;
  }

  async function confirmarCancelar() {
    const num = document.getElementById('num-reserva-input').value.trim();
    if(!num) { mostrarMensajeCancelar("Ingrese un número de reserva.", "error"); return; }
    
    if(confirm("¿Seguro que desea cancelar?")) {
      document.getElementById('loader-cancelar').style.display = 'block';
      
      try {
        const response = await fetch(`${WORKER_URL}?action=cancelar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ numeroReserva: num })
        });
        
        const res = await response.json();
        document.getElementById('loader-cancelar').style.display = 'none';
        
        mostrarMensajeCancelar(res.exito ? res.mensaje : res.error, res.exito ? 'success' : 'error');
        if (res.exito) document.getElementById('num-reserva-input').value = '';
      } catch(err) {
        document.getElementById('loader-cancelar').style.display = 'none';
        mostrarMensajeCancelar("Error al comunicarse con el servidor.", "error");
      }
    }
  }
</script>
</body>
</html>
