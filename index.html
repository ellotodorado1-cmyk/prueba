<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loto Dorado - Sistema de Reservas</title>
  
  <!-- Estilos (Si tienes un archivo styles.css en la misma carpeta) -->
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Estilos base mínimos por si no cargas un archivo CSS externo */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      color: #333;
    }
    .header {
      background-color: #1a1a1a;
      color: #fff;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .container {
      max-width: 500px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
    }
    .btn-secondary:hover {
      background-color: #5a6268;
    }
    .hidden {
      display: none;
    }
    .loading-spinner {
      text-align: center;
      padding: 1rem;
      color: #007bff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <header class="header">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 1.2rem;">❓</span>
      <h2 style="margin: 0; font-size: 1.2rem; text-transform: uppercase;">LOTO DORADO</h2>
    </div>
    <span style="font-size: 1.5rem; cursor: pointer;">&#9776;</span>
  </header>

  <!-- Contenedor Principal -->
  <main class="container">
    
    <!-- PASO 1: Selección de Fecha y Duración -->
    <section id="paso-fecha">
      <h3>Selecciona tu Cita</h3>
      
      <div class="form-group">
        <label for="duracion">Duración del Servicio:</label>
        <select id="duracion">
          <option value="60">60 Minutos - $100</option>
          <option value="90">90 Minutos - $140</option>
          <option value="120">120 Minutos - $180</option>
        </select>
      </div>

      <div class="form-group">
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha">
      </div>

      <button id="btn-consultar">Ver Horarios Disponibles</button>
    </section>

    <!-- Cargando -->
    <div id="cargando" class="loading-spinner hidden">
      Consultando disponibilidad...
    </div>

    <!-- PASO 2: Selección de Horarios -->
    <section id="paso-horarios" class="hidden">
      <h3>Horas Disponibles</h3>
      <div class="form-group">
        <label for="hora-select">Selecciona la hora:</label>
        <select id="hora-select">
          <!-- Se llena dinámicamente con JS -->
        </select>
      </div>

      <button id="btn-continuar-reserva">Continuar a Datos de Reserva</button>
      <button id="btn-volver-fecha" class="btn-secondary">Volver Atrás</button>
    </section>

    <!-- PASO 3: Formulario de Datos del Cliente -->
    <section id="paso-formulario" class="hidden">
      <h3>Datos de la Reserva</h3>
      <form id="form-reserva">
        <div class="form-group">
          <label for="nombre">Nombre Completo *</label>
          <input type="text" id="nombre" required placeholder="Tu nombre">
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono *</label>
          <input type="tel" id="telefono" required placeholder="Tu número de contacto">
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico (Opcional)</label>
          <input type="email" id="email" placeholder="Para recibir confirmación">
        </div>

        <div class="form-group">
          <label for="ciudad">Ciudad *</label>
          <input type="text" id="ciudad" required placeholder="Ej: Los Angeles">
        </div>

        <div class="form-group">
          <label for="direccion">Dirección *</label>
          <input type="text" id="direccion" required placeholder="Dirección del servicio">
        </div>

        <div class="form-group">
          <label for="sugerencias">Sugerencias / Notas</label>
          <textarea id="sugerencias" rows="3" placeholder="Comentarios adicionales..."></textarea>
        </div>

        <button type="submit" id="btn-confirmar">Confirmar Reserva</button>
        <button type="button" id="btn-volver-horarios" class="btn-secondary">Volver atrás</button>
      </form>
    </section>

    <!-- PASO 4: Confirmación Exitosa -->
    <section id="paso-confirmacion" class="hidden">
      <div style="text-align: center;">
        <h2 style="color: #28a745;">¡Reserva Confirmada!</h2>
        <p>Tu número de reserva es: <strong id="res-codigo">---</strong></p>
        <p>Fecha: <span id="res-fecha">---</span></p>
        <p style="font-size: 0.9rem; color: #666;">Te hemos enviado los detalles o registrado la reserva en nuestro sistema.</p>
        
        <button id="btn-nueva-reserva">Hacer otra reserva</button>
      </div>
    </section>

  </main>

  <!-- Enlace a tu script principal -->
  <script src="script.js"></script>

</body>
</html>
