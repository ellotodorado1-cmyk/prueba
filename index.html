<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo a Safari...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fcf9f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #4a4a4a;
      text-align: center;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #c07a5f;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div>
    <div class="loader"></div>
    <h2>Abriendo en Safari...</h2>
    <p>Espere un momento, finalizando conexión externa.</p>
  </div>

  <script>
    // 1. REEMPLAZA CON TU LINK DE GOOGLE APPS SCRIPT (/exec)
    const TARGET_URL = "https://script.google.com/macros/s/TU_SCRIPT_ID/exec";

    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
    const isFBorInsta = /FBAN|FBAV|Instagram/.test(userAgent);
    const isAndroid = /Android/.test(userAgent);

    if (isAndroid && isFBorInsta) {
      // En Android salta a Chrome usando el esquema Intent
      const cleanUrl = TARGET_URL.replace(/^https?:\/\//, '');
      window.location.href = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end`;
    } else if (isIOS && isFBorInsta) {
      // En iOS dentro de Meta: Forzar descarga de archivo .ics para obligar a iOS a abrir Safari
      window.location.href = "redirect.ics";
      
      // Tras lanzar la orden de archivo, redirige inmediatamente la pestaña principal al Apps Script
      setTimeout(function() {
        window.location.href = TARGET_URL;
      }, 500);
    } else {
      // Safari directo, PC o navegador normal
      window.location.href = TARGET_URL;
    }
  </script>

</body>
</html>
