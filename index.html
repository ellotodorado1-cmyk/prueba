<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Citas</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --error-bg: #fef2f2;
      --error-text: #991b1b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      padding: 24px;
      box-sizing: border-box;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: var(--text);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    select, input[type="date"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 16px;
      box-sizing: border-box;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #64748b;
      margin-right: 8px;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .grid-horas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .hora-btn {
      padding: 8px;
      border: 1px solid var(--primary);
      border-radius: 6px;
      background: white;
      color: var(--primary);
      text-align: center;
      cursor: pointer;
      font-weight: 500;
    }

    .hora-btn:hover {
      background-color: var(--primary);
      color: white;
    }

    .loader {
      display: none;
      text-align: center;
      padding: 20px;
      color: #64748b;
    }

    .error-banner {
      display: none;
      background-color: var(--error-bg);
      color: var(--error-text);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>

<div class="container">
  
  <div id="errorBanner" class="error-banner"></div>

  <!-- PASO 1: SELECCIÓN DE SERVICIO -->
  <div id="paso1" class="step active">
    <h2>1. Selecciona el servicio</h2>
    <label for="servicioSelect">Duración del servicio:</label>
    <select id="servicioSelect">
      <option value="30">Consulta corta (30 min)</option>
      <option value="60" selected>Servicio Estándar (1 hora)</option>
      <option value="120">Servicio Extendido (2 horas)</option>
    </select>
    <button class="btn" onclick="irAlCalendario()">Ver disponibilidad</button>
  </div>

  <!-- PASO 2: CALENDARIO Y HORAS -->
  <div id="paso2" class="step">
    <h2>2. Selecciona Fecha y Hora</h2>
    
    <label for="fechaInput">Fecha:</label>
    <input type="date" id="fechaInput" onchange="mostrarHorasDeFecha(this.value)">

    <div id="loader" class="loader">Cargando disponibilidad de Google Calendar...</div>
    
    <div id="horasContainer"></div>

    <div style="margin-top: 24px;">
      <button class="btn btn-secondary" onclick="volverAtras()">Volver atrás</button>
    </div>
  </div>

</div>

<script>
  // ==========================================
  // ESTADO GLOBAL Y CACHÉ
  // ==========================================
  let cacheDisponibilidad = null;
  let duracionPrecedente = null;

  // Establecer fecha mínima como hoy
  const hoyISO = new Date().toISOString().split('T')[0];
  document.getElementById('fechaInput').min = hoyISO;
  document.getElementById('fechaInput').value = hoyISO;

  /**
   * Navega del Paso 1 al Paso 2. 
   * Solo realiza la consulta si la duración del servicio ha cambiado.
   */
  function irAlCalendario() {
    const nuevaDuracion = parseInt(document.getElementById('servicioSelect').value);
    
    ocultarError();
    mostrarPaso('paso2');

    // Si ya tenemos datos en caché para la misma duración, los reutilizamos sin recargar
    if (cacheDisponibilidad && duracionPrecedente === nuevaDuracion) {
      mostrarHorasDeFecha(document.getElementById('fechaInput').value);
      return;
    }

    // Si cambió la duración o es la primera carga, consultamos al backend
    duracionPrecedente = nuevaDuracion;
    cargarHorariosServidor(nuevaDuracion);
  }

  /**
   * Regresa al Paso 1 manteniendo los datos intactos en memoria.
   */
  function volverAtras() {
    ocultarError();
    mostrarPaso('paso1');
  }

  /**
   * Consulta al servidor (Codigo.gs) con lógica de renderizado
   */
  function cargarHorariosServidor(duracion) {
    mostrarLoader(true);
    document.getElementById('horasContainer').innerHTML = '';

    google.script.run
      .withSuccessHandler(function(datos) {
        mostrarLoader(false);
        cacheDisponibilidad = datos;
        mostrarHorasDeFecha(document.getElementById('fechaInput').value);
      })
      .withFailureHandler(function(error) {
        mostrarLoader(false);
        mostrarError("Hubo un problema de conexión al obtener la disponibilidad. Inténtalo de nuevo.");
        console.error("Error devuelto por Apps Script:", error);
      })
      .obtenerDisponibilidad(duracion);
  }

  /**
   * Muestra las horas guardadas en la caché para la fecha elegida
   */
  function mostrarHorasDeFecha(fecha) {
    const container = document.getElementById('horasContainer');
    container.innerHTML = '';

    if (!cacheDisponibilidad) return;

    const horasDisponibles = cacheDisponibilidad[fecha] || [];

    if (horasDisponibles.length === 0) {
      container.innerHTML = '<p style="color: #64748b; font-size: 0.9rem;">No hay horarios disponibles para esta fecha.</p>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'grid-horas';

    horasDisponibles.forEach(hora => {
      const btn = document.createElement('button');
      btn.className = 'hora-btn';
      btn.innerText = hora;
      btn.onclick = function() {
        alert(`Has seleccionado el día ${fecha} a las ${hora}`);
      };
      grid.appendChild(btn);
    });

    container.appendChild(grid);
  }

  // --- FUNCIONES AUXILIARES ---
  function mostrarPaso(idPaso) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(idPaso).classList.add('active');
  }

  function mostrarLoader(visible) {
    document.getElementById('loader').style.display = visible ? 'block' : 'none';
  }

  function mostrarError(mensaje) {
    const banner = document.getElementById('errorBanner');
    banner.innerText = mensaje;
    banner.style.display = 'block';
  }

  function ocultarError() {
    const banner = document.getElementById('errorBanner');
    banner.style.display = 'none';
  }
</script>

</body>
</html>
