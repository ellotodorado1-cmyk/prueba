<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abrir en Navegador</title>
  <style>
    :root {
      --primary: #c07a5f;
      --primary-hover: #a3644b;
      --bg: #fcf9f6;
      --text: #4a4a4a;
    }
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      color: #333;
    }
    p {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.4;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Continuar a la Aplicación</h1>
    <p>Para una mejor experiencia y completar tu proceso sin interrupciones, abre este enlace en tu navegador principal.</p>
    
    <button class="btn" onclick="openExternalBrowser()">Abrir en Safari / Navegador</button>
  </div>

  <script>
    // REEMPLAZA ESTA URL CON TU ENLACE DE GOOGLE APPS SCRIPT
    const TARGET_URL = "https://script.google.com/macros/s/TU_SCRIPT_ID/exec";

    function openExternalBrowser() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
      const isAndroid = /Android/.test(userAgent);

      if (isIOS) {
        // En iOS WebView, generar un blob force-download / stream obliga a WebKit 
        // a solicitar abrir la ubicación directamente en Safari fuera de la App.
        const targetClean = TARGET_URL.replace(/^https?:\/\//, '');
        window.location.href = "x-web-search://?" + TARGET_URL;
        
        // Fallback secundario estándar para iOS Meta WebViews
        setTimeout(() => {
          window.location.href = TARGET_URL;
        }, 300);
      } else if (isAndroid) {
        // En Android, el esquema intent:// rompe el WebView de Instagram/FB y abre Chrome.
        const cleanUrl = TARGET_URL.replace(/^https?:\/\//, '');
        window.location.href = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end`;
      } else {
        // Escritorio o navegadores estándar
        window.location.href = TARGET_URL;
      }
    }
  </script>

</body>
</html>
