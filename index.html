<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Abrir en Navegador</title>
  <style>
    :root {
      --primary: #c07a5f;
      --primary-hover: #a3644b;
      --bg: #fcf9f6;
      --text: #4a4a4a;
    }
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      color: #333;
    }
    p {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.4;
    }
    .btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active {
      background-color: var(--primary-hover);
    }
    .instructions {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #888;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Continuar a la Aplicación</h1>
    <p>Haz clic en el botón para abrir el sistema de reservas en Safari.</p>
    
    <!-- Enlace nativo tipo <a> (requerido por WebKit iOS) -->
    <a id="open-link" class="btn" href="#">Abrir en Safari</a>

    <div class="instructions">
      <p style="margin:0;">Si no abre automáticamente, toca los <strong>tres puntos (•••)</strong> arriba a la derecha y selecciona <strong>"Abrir en Safari"</strong>.</p>
    </div>
  </div>

  <script>
    // REEMPLAZA ESTA URL CON TU LINK DE GOOGLE APPS SCRIPT
    const TARGET_URL = "https://script.google.com/macros/s/TU_SCRIPT_ID/exec";

    const linkBtn = document.getElementById('open-link');
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
    const isAndroid = /Android/.test(userAgent);

    if (isAndroid) {
      // Android: Intent directo a Chrome
      const cleanUrl = TARGET_URL.replace(/^https?:\/\//, '');
      linkBtn.href = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end`;
    } else if (isIOS) {
      // iOS: Uso de data URL mime-type para forzar a WebKit a descargar/abrir fuera de la App
      const rawContent = `<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=${TARGET_URL}"></head><body></body></html>`;
      const blob = new Blob([rawContent], { type: 'text/html' });
      const blobUrl = URL.createObjectURL(blob);
      
      linkBtn.href = TARGET_URL;
      linkBtn.target = "_blank";
      linkBtn.rel = "noopener noreferrer";

      linkBtn.addEventListener('click', function(e) {
        // Ejecuta intento directo alterno en el evento de clic nativo
        window.open(TARGET_URL, '_system');
      });
    } else {
      // Escritorio o navegadores normales
      linkBtn.href = TARGET_URL;
    }
  </script>

</body>
</html>
